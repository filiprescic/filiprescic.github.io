site_name: Filip Rescic - personal page
theme: 
  name: material  
  features:
    - navigation.tabs
    #- navigation.tabs.sticky
    #- navigation.top
    - navigation.sections
    #- navigation.tracking
    - toc.integrate
    - navigation.footer
    - content.code.copy
  font:
    text: Roboto 
  custom_dir: overrides
  icon:
    logo: material/library
  palette: 
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-6 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins: []
nav: 
  - index.md
  - science.md
  - teaching.md
  - papers.md
  - projects.md
not_in_nav: |
  /nastava.md
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets    
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: custom/orcid
      link: https://orcid.org/0000-0002-9664-5414
    - icon: custom/inspire
      link: https://inspirehep.net/authors/2698695
