site_name: Filip Rescic - personal page
theme: 
  features:
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    - toc.integrate
  name: material  
  font:
    text: Roboto 
  custom_dir: overrides
  icon:
    logo: material/library
  palette: 
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins: []
nav: 
  - index.md
  - science.md
  - teaching.md
  - papers.md
  - projects.md
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences    
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: custom/orcid
      link: https://orcid.org/0000-0002-9664-5414
    - icon: custom/inspire
      link: https://inspirehep.net/authors/2698695
    - icon: custom/google-scholar
      link: https://scholar.google.com/citations?user=No6TvC4AAAAJ&hl=hr&oi=ao
  
